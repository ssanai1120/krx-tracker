<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보유종목 시세판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#1B2431; --muted:#66707F;
  --line:#E4E8EE; --line-soft:#EEF1F5; --accent:#234A78; --accent-ink:#FFFFFF;
  --up:#D64545; --down:#2B6CD4; --chip:#EDF2F8; --danger:#B3261E;
  --shadow:0 1px 3px rgba(20,30,50,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131820; --surface:#1B222D; --ink:#E7ECF2; --muted:#8C97A8;
    --line:#2A3340; --line-soft:#232C38; --accent:#7FA8D9; --accent-ink:#101722;
    --up:#F07575; --down:#77A9F5; --chip:#232E3C; --danger:#F2B8B5;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#131820; --surface:#1B222D; --ink:#E7ECF2; --muted:#8C97A8;
  --line:#2A3340; --line-soft:#232C38; --accent:#7FA8D9; --accent-ink:#101722;
  --up:#F07575; --down:#77A9F5; --chip:#232E3C; --danger:#F2B8B5;
  --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  font-size:13px;line-height:1.45;}
#app{padding:18px 20px 40px;max-width:1600px;margin:0 auto;}
.hdr{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-bottom:14px;}
.hdr h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;}
.hdr .asof{color:var(--muted);font-size:12px;margin-left:2px;}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:8px 14px;box-shadow:var(--shadow);min-width:120px;}
.stat .lbl{font-size:11px;color:var(--muted);letter-spacing:.04em;}
.stat .val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
button,a.btn{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);padding:7px 14px;font-weight:600;
  text-decoration:none;display:inline-block;}
button:hover,a.btn:hover{border-color:var(--accent);}
button:focus-visible,a.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
button:disabled{opacity:.45;cursor:default;}
select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:7px 10px;
  background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;}
.dirty-note{font-size:12px;color:var(--up);font-weight:600;}
.tblwrap{overflow:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;
  font-variant-numeric:tabular-nums;}
th,td{padding:6px 10px;white-space:nowrap;border-bottom:1px solid var(--line-soft);text-align:right;}
th{position:sticky;top:0;background:var(--surface);z-index:3;font-size:11px;color:var(--muted);
  font-weight:600;letter-spacing:.03em;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
th.chk,td.chk{position:sticky;left:0;background:var(--surface);z-index:2;width:34px;
  text-align:center;padding:6px 8px;cursor:default;}
th.chk{z-index:4;}
th.sig,td.sig{position:sticky;left:34px;background:var(--surface);z-index:2;width:32px;
  text-align:center;padding:6px 4px;}
th.sig{z-index:4;}
.dot{width:13px;height:13px;border-radius:50%;display:inline-block;vertical-align:middle;
  border:1px solid rgba(128,128,128,.4);}
.s-r{background:#E5484D;border-color:#E5484D;}
.s-o{background:#F59E0B;border-color:#F59E0B;}
.s-y{background:#F2D052;border-color:#E5C33B;}
.s-g{background:#3FA85C;border-color:#3FA85C;}
.s-b{background:#3E7BFA;border-color:#3E7BFA;}
.s-n{background:transparent;border-style:dashed;}
.dot.pick{cursor:pointer;transition:transform .1s;}
.dot.pick:hover{transform:scale(1.25);}
.dot.sel{outline:2px solid var(--accent);outline-offset:2px;}
.sigpop{position:fixed;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px 10px;display:flex;gap:8px;z-index:25;}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted);
  margin:0 0 10px 2px;flex-wrap:wrap;}
.legend span{display:inline-flex;gap:5px;align-items:center;}
.lbl-in{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;
  padding:2px 6px;width:86px;background:var(--surface);color:var(--ink);}
.pencil{border:none;background:none;cursor:pointer;color:var(--line);font-size:12px;
  padding:0 2px;flex:none;}
.pencil.act{color:var(--accent);}
.pencil:hover{color:var(--accent);border:none;}
.modal.wide{width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column;}
.modal .mscroll{overflow-y:auto;padding:0 18px 6px;}
.tstat{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 14px;}
.tstat>div{background:var(--chip);border-radius:7px;padding:7px 10px;}
.tstat .lbl{font-size:10px;color:var(--muted);}
.tstat .val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.tsec{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;
  border-bottom:1px solid var(--line-soft);padding-bottom:4px;}
.trow{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid var(--line-soft);
  font-variant-numeric:tabular-nums;font-size:12px;}
.trow .chipb,.trow .chips{font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;}
.chipb{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up);}
.chips{background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down);}
.trow .sp{flex:1;}
.trow button{padding:2px 8px;font-size:11px;}
.tform{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0;}
.tform input,.tform select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:5px;
  padding:5px 7px;background:var(--bg);color:var(--ink);}
.sim{display:grid;gap:8px;}
.simrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;
  background:var(--chip);border-radius:7px;padding:8px 10px;}
.simrow input{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:5px;
  padding:4px 6px;width:76px;text-align:right;background:var(--surface);color:var(--ink);}
.simrow b{font-variant-numeric:tabular-nums;}
.memo-ta{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;
  padding:8px;background:var(--bg);color:var(--ink);width:100%;height:70px;resize:vertical;}
.round{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--bg);}
.rhead{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap;margin-bottom:2px;}
.rhead .chipb,.rhead .chips{font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;}
.rhead .rsum{font-variant-numeric:tabular-nums;}
.rhead .sp{flex:1;}
.rhead button{padding:2px 8px;font-size:11px;}
.donefold{font-size:11px;color:var(--muted);cursor:pointer;margin:6px 0;user-select:none;}
.rarrow{font-size:13px;color:var(--accent);width:18px;text-align:center;flex:none;}
th.name,td.name{position:sticky;left:66px;background:var(--surface);z-index:2;text-align:left;
  font-weight:600;border-right:1px solid var(--line);width:150px;max-width:150px;}
.namecell{display:flex;align-items:center;gap:4px;width:100%;}
.namecell .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
th.name{z-index:4;}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
/* 행 하이라이트: 배경 대신 회색 아래줄 (히트맵 색이 변하지 않음) · 체크한 종목은 항상 유지 */
tbody tr:hover td,tbody tr.selrow td{box-shadow:inset 0 -2px 0 var(--muted);}
td.up{color:var(--up);} td.down{color:var(--down);}
td.pct{background:color-mix(in srgb, var(--hcol,transparent) calc(var(--i,0)*1%), transparent);}
td.dim{color:var(--muted);}
tfoot td{font-weight:700;border-top:1px solid var(--line);background:var(--surface);
  position:sticky;bottom:0;z-index:3;}
tfoot td.name{border-right:1px solid var(--line);z-index:4;}
tfoot td.chk{z-index:4;}
tfoot td.sig{z-index:4;}
td.name input{font:inherit;width:130px;text-align:left;border:1px solid var(--line);
  border-radius:5px;padding:3px 6px;background:var(--bg);color:var(--ink);}
.filt{opacity:.35;font-size:8px;margin-left:2px;}
td input[type=text],td input:not([type]){font:inherit;width:90px;text-align:right;border:1px solid var(--line);
  border-radius:5px;padding:3px 6px;background:var(--bg);color:var(--ink);}
.del{border:none;background:none;color:var(--danger);font-weight:700;padding:2px 6px;cursor:pointer;}
.addbox{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--chip);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
.addbox input{font:inherit;border:1px solid var(--line);border-radius:5px;padding:5px 8px;
  background:var(--surface);color:var(--ink);}
.sortmark{font-size:9px;margin-left:3px;}
.hint{font-size:11px;color:var(--muted);}
.err{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:14px;margin:20px 0;}
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;
  align-items:center;justify-content:center;z-index:20;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.25);width:min(520px,100%);padding:18px;}
.modal h2{font-size:15px;margin:0 0 8px;}
.modal p{font-size:12px;color:var(--muted);margin:6px 0;}
.modal input{font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 9px;
  background:var(--bg);color:var(--ink);width:100%;margin:8px 0;}
.modal .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--bg);padding:9px 18px;border-radius:8px;font-weight:600;z-index:30;}
@media (prefers-reduced-motion: no-preference){
  .toast{animation:pop .18s ease-out;}
  @keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(6px);}to{opacity:1;transform:translateX(-50%);}}
}
</style>
</head>
<body>
<div id="app"><p class="hint" style="padding:20px">데이터를 불러오는 중…</p></div>
<script>
'use strict';
let HOLD=[], HIST=[], sortKey=null, sortDir=1, editMode=false, dirty=false, onlySel=false;
let SEL=new Set();
try{ SEL=new Set(JSON.parse(localStorage.getItem('sel_codes')||'[]')); }catch(_){}
function saveSel(){ try{localStorage.setItem('sel_codes',JSON.stringify([...SEL]));}catch(_){} }

const $=s=>document.querySelector(s);
const fmt=n=>n==null||isNaN(n)?'—':Math.round(n).toLocaleString('ko-KR');
const fpct=v=>v==null?'':((v>0?'+':'')+(v*100).toFixed(1));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function repoInfo(){
  const h=location.hostname, seg=location.pathname.split('/').filter(Boolean);
  if(h.endsWith('.github.io')&&seg.length>=1)
    return {owner:h.split('.')[0], repo:seg[0]};
  return null;
}
function getToken(){ try{return localStorage.getItem('gh_token')||'';}catch(_){return '';} }
function setToken(t){ try{localStorage.setItem('gh_token',t);}catch(_){} }

const SIG_KEYS=['r','o','y','g','b','n'];
const SIG_ORDER={r:0,o:1,y:2,g:3,b:4};
let LABELS={r:'',o:'',y:'',g:'',b:''};   // 색 이름: 종목 편집에서 직접 지정 (빈칸 허용)
const lbl=v=>v==='n'?'미지정':(LABELS[v]||'');
const sigDot=(v,extra='')=>`<span class="dot s-${v||'n'}${extra}"></span>`;

function priceAt(code,back){
  const i=HIST.length-1-back;
  if(i<0)return null;
  const v=HIST[i].p[code];
  return (typeof v==='number'&&isFinite(v))?v:null;
}
/* 히트맵: ±5% 미만 옅게 → ±20%까지 점점 진하게 → ±20% 이상은 확실히 진하고 굵게 */
function baseDate(k){          // kD% 비교 기준일 (k거래일 전 날짜)
  const i=HIST.length-1-k;
  return i>=0?HIST[i].d:null;
}
function pctCell(v,k){
  const d=baseDate(k);
  const tip=d?` title="${k}D 기준일: ${d}"`:'';
  if(v==null)return `<td class="pct dim"${tip}></td>`;
  const cls=v>0?'up':(v<0?'down':'');
  const col=v>0?'var(--up)':'var(--down)';
  const a=Math.abs(v);
  const i=a>=0.20?40:Math.min(a/0.20,1)*32;
  return `<td class="pct ${cls}" style="--hcol:${col};--i:${i.toFixed(1)}"${tip}>${fpct(v)}</td>`;
}

function render(){
  let rows=HOLD.map((h,idx)=>{
    const cur=priceAt(h.code,0);
    const cost=h.buy*h.qty, val=cur!=null?cur*h.qty:null;
    const pl=val!=null?val-cost:null, rr=(pl!=null&&cost>0)?pl/cost:null;
    const d=[];
    for(let k=1;k<=20;k++){const past=priceAt(h.code,k);d.push((cur!=null&&past)?cur/past-1:null);}
    return {h,idx,cur,cost,val,pl,rr,d};
  });
  if(onlySel&&!editMode) rows=rows.filter(r=>SEL.has(r.h.code));
  if(sortKey&&!editMode){
    rows.sort((a,b)=>{
      if(sortKey==='n'){return sortDir*(a.h.name<b.h.name?-1:1);}
      const dm=/^d(\d+)$/.exec(sortKey);
      const pick=r=>sortKey==='sel'?(SEL.has(r.h.code)?1:0)
        :sortKey==='sig'?-(SIG_ORDER[r.h.sig]??9)
        :dm?r.d[+dm[1]-1]:(sortKey==='buy'?r.h.buy:(sortKey==='qty'?r.h.qty:r[sortKey]));
      let x=pick(a),y=pick(b);
      if(x==null)x=-Infinity; if(y==null)y=-Infinity;
      return sortDir*(x-y);
    });
  }
  const tCost=rows.reduce((s,r)=>s+r.cost,0);
  const tVal=rows.reduce((s,r)=>s+(r.val||0),0);
  const tPl=tVal-tCost, tRr=tCost>0?tPl/tCost:0;
  const lastSnap=HIST[HIST.length-1];
  const asof=lastSnap?(lastSnap.d+(lastSnap.t?' '+lastSnap.t:'')):'—';
  const sm=k=>sortKey===k?`<span class="sortmark">${sortDir>0?'▲':'▼'}</span>`:'<span class="filt">▼</span>';
  const ri=repoInfo();
  const allChecked=rows.length>0&&rows.every(r=>SEL.has(r.h.code));

  let dcols='';
  for(let k=1;k<=20;k++){
    const d=baseDate(k);
    dcols+=`<th data-sort="d${k}"${d?` title="${k}D 기준일: ${d}"`:''}>${k}D %${sm('d'+k)}</th>`;
  }
  let body='';
  for(const r of rows){
    const h=r.h;
    const chk=`<td class="chk"><input type="checkbox" data-sel="${esc(h.code)}" ${SEL.has(h.code)?'checked':''} aria-label="${esc(h.name)} 선택"></td>`;
    let sig,name,buy,qty;
    if(editMode){
      sig=`<td class="sig"><span class="dot pick s-${h.sig||'n'}" data-sigi="${r.idx}" title="신호 변경"></span></td>`;
      name=`<td class="name"><button class="del" data-del="${r.idx}" title="삭제">✕</button> <input data-f="name" data-i="${r.idx}" value="${esc(h.name)}"> <span class="hint">${esc(h.code)}</span></td>`;
      buy=`<td><input data-f="buy" data-i="${r.idx}" value="${h.buy}"></td>`;
      qty=`<td><input data-f="qty" data-i="${r.idx}" value="${h.qty}"></td>`;
    }else{
      sig=`<td class="sig">${sigDot(h.sig)}</td>`;
      name=`<td class="name"><span class="namecell"><span class="nm" title="${esc(h.name)}">${esc(h.name)}</span><button class="pencil${hasActivity(h)?' act':''}" data-trade="${r.idx}" title="${hasActivity(h)?'기록 있음 — ':''}매매 기록·시뮬레이션·메모">✎</button></span></td>`;
      buy=`<td>${fmt(h.buy)}</td>`; qty=`<td>${fmt(h.qty)}</td>`;
    }
    const plCls=r.pl>0?'up':(r.pl<0?'down':'');
    body+=`<tr${SEL.has(h.code)?' class="selrow"':''}>${chk}${sig}${name}${buy}${qty}
      <td>${fmt(r.cost)}</td><td class="${plCls}">${fmt(r.pl)}</td>
      <td class="${plCls}">${r.rr==null?'—':fpct(r.rr)}</td>
      <td>${fmt(r.cur)}</td>${r.d.map((v,i)=>pctCell(v,i+1)).join('')}</tr>`;
  }
  const addbox=editMode?`<div class="addbox">
      <b style="font-size:12px">종목 추가</b>
      <input id="add-code" placeholder="종목코드 (예: 005930)" style="width:150px">
      <input id="add-name" placeholder="종목명" style="width:150px">
      <input id="add-buy" placeholder="매입단가" style="width:110px;text-align:right">
      <input id="add-qty" placeholder="수량" style="width:80px;text-align:right">
      <span style="display:inline-flex;gap:7px;align-items:center;padding:0 4px">
        ${SIG_KEYS.map(v=>`<span class="dot pick s-${v}${v==='n'?' sel':''}" data-addsig="${v}" title="${esc(lbl(v))}"></span>`).join('')}
      </span>
      <button id="add-go" class="primary">추가</button>
      <span class="hint">새 종목은 다음 조회 때 과거 시세까지 자동으로 채워집니다</span>
    </div>`:'';
  const plCls=tPl>0?'up':(tPl<0?'down':'');
  $('#app').innerHTML=`
  <div class="hdr">
    <div><h1>보유종목 시세판</h1><span class="asof">기준일 ${asof} · ${rows.length}${onlySel?'/'+HOLD.length:''}종목 · 시세기록 ${HIST.length}일</span></div>
    <div class="stats">
      <div class="stat"><div class="lbl">${onlySel?'선택':'총'} 매입금액</div><div class="val">${fmt(tCost)}</div></div>
      <div class="stat"><div class="lbl">${onlySel?'선택':'총'} 평가금액</div><div class="val">${fmt(tVal)}</div></div>
      <div class="stat"><div class="lbl">평가손익</div><div class="val" style="color:var(--${tPl>=0?'up':'down'})">${fmt(tPl)}</div></div>
      <div class="stat"><div class="lbl">수익률</div><div class="val" style="color:var(--${tPl>=0?'up':'down'})">${fpct(tRr)}%</div></div>
    </div>
  </div>
  <div class="bar">
    <button class="primary" id="btn-reload">새로고침</button>
    <button id="btn-onlysel" class="${onlySel?'on':''}">선택만 보기 (${SEL.size})</button>
    <button id="btn-edit">${editMode?'편집 닫기':'종목 편집'}</button>
    ${(editMode||dirty)?`<button class="primary" id="btn-save" ${dirty?'':'disabled'}>GitHub에 저장</button>`:''}
    ${dirty?'<span class="dirty-note">저장되지 않은 변경사항</span>':''}
    ${ri?`<a class="btn" href="https://github.com/${ri.owner}/${ri.repo}/actions/workflows/update.yml" target="_blank" rel="noopener">지금 조회 실행</a>`:''}
  </div>
  ${addbox}
  <div class="legend">
    ${editMode
      ?SIG_KEYS.filter(v=>v!=='n').map(v=>`<span>${sigDot(v)} <input class="lbl-in" data-lbl="${v}" value="${esc(LABELS[v]||'')}" placeholder="이름 입력"></span>`).join('')
       +`<span>${sigDot('n')} 미지정</span><span class="hint">· 색 이름을 정해두면 범례와 점 설명에 표시됩니다</span>`
      :SIG_KEYS.filter(v=>v!=='n').map(v=>`<span>${sigDot(v)}${LABELS[v]?' '+esc(LABELS[v]):''}</span>`).join('')

    <thead><tr>
      <th class="chk" data-sort="sel" style="cursor:pointer"><input type="checkbox" id="chk-all" ${allChecked?'checked':''} aria-label="전체 선택">${sm('sel')}</th>
      <th class="sig" data-sort="sig" title="신호 정렬">●${sm('sig')}</th>

      <th data-sort="qty">매입수량${sm('qty')}</th>
      <th data-sort="cost">매입금액${sm('cost')}</th>
      <th data-sort="pl">평가손익${sm('pl')}</th>
      <th data-sort="rr">수익률${sm('rr')}</th>
      <th data-sort="cur">현재가${sm('cur')}</th>${dcols}
    </tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td class="chk"></td><td class="sig"></td><td class="name">합계</td><td></td><td></td>
      <td>${fmt(tCost)}</td><td class="${plCls}">${fmt(tPl)}</td>
      <td class="${plCls}">${fpct(tRr)}%</td><td></td><td colspan="20"></td></tr></tfoot>
  </table></div>
  <p class="hint" style="margin-top:8px">nD % = 최신 종가가 n거래일 전 대비 등락률 (±20% 이상은 진하게 강조) · 체크한 종목은 [선택만 보기]로 모아 비교 ·
  정렬은 드롭다운 또는 열 제목 클릭 · 시세는 자동 기록, [지금 조회 실행]으로 수동 갱신</p>
  <div id="modal-slot"></div>`;
  bind();
}

function markDirty(){dirty=true;const b=$('#btn-save');if(b)b.disabled=false;}

function bind(){
  $('#btn-reload').onclick=load;
  $('#btn-edit').onclick=()=>{
    if(editMode&&dirty&&!confirm('저장하지 않은 변경사항이 있습니다. 편집을 닫을까요?'))return;
    editMode=!editMode; render();
  };
  $('#btn-onlysel').onclick=()=>{
    if(!SEL.size&&!onlySel){toast('먼저 비교할 종목을 체크하세요');return;}
    onlySel=!onlySel; render();
  };
  $('#chk-all').onchange=e=>{
    const codes=[...document.querySelectorAll('input[data-sel]')].map(i=>i.dataset.sel);
    if(e.target.checked)codes.forEach(c=>SEL.add(c)); else codes.forEach(c=>SEL.delete(c));
    saveSel(); render();
  };
  document.querySelectorAll('input[data-sel]').forEach(cb=>{
    cb.onchange=()=>{
      if(cb.checked)SEL.add(cb.dataset.sel); else SEL.delete(cb.dataset.sel);
      saveSel();
      const btn=$('#btn-onlysel'); btn.textContent=`선택만 보기 (${SEL.size})`;
      cb.closest('tr').classList.toggle('selrow',cb.checked);  // 밑줄 즉시 반영
      if(onlySel)render();
    };
  });
  const sv=$('#btn-save'); if(sv)sv.onclick=saveHoldings;
  document.querySelectorAll('.pencil[data-trade]').forEach(b=>{
    b.onclick=e=>{e.stopPropagation();openTrade(+b.dataset.trade);};
  });
  document.querySelectorAll('th[data-sort]').forEach(th=>{
    th.onclick=e=>{
      if(e.target.type==='checkbox')return;
      const k=th.dataset.sort;
      if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=k==='n'?1:-1;}render();};
  });
  // 틀고정: 표 내용만 세로 스크롤 (상단 요약·버튼·헤더행·합계행은 화면에 고정)
  const wrap=$('#wrap');
  const fit=()=>{wrap.style.maxHeight=Math.max(240,window.innerHeight-wrap.getBoundingClientRect().top-14)+'px';};
  fit(); window.onresize=fit;
  if(editMode){
    document.querySelectorAll('.del').forEach(b=>{
      b.onclick=()=>{
        const h=HOLD[+b.dataset.del];
        if(confirm(h.name+' 종목을 삭제할까요?')){SEL.delete(h.code);saveSel();HOLD.splice(+b.dataset.del,1);markDirty();render();}
      };
    });
    document.querySelectorAll('td input[data-f]').forEach(inp=>{
      inp.onchange=()=>{
        const i=+inp.dataset.i;
        if(inp.dataset.f==='name'){
          const nv=inp.value.trim();
          if(nv&&nv!==HOLD[i].name){HOLD[i].name=nv;markDirty();render();}
          return;
        }
        const v=parseFloat(String(inp.value).replace(/,/g,''));
        if(isFinite(v)&&v>0){HOLD[i][inp.dataset.f]=v;markDirty();render();}
      };
    });
    // 신호등 변경: 점 클릭 → 색상 선택 팝업
    document.querySelectorAll('.dot[data-sigi]').forEach(d=>{
      d.onclick=e=>{
        document.querySelectorAll('.sigpop').forEach(p=>p.remove());
        const i=+d.dataset.sigi;
        const pop=document.createElement('div');
        pop.className='sigpop';
        pop.innerHTML=SIG_KEYS.map(v=>`<span class="dot pick s-${v}" data-pickv="${v}" title="${esc(lbl(v))}"></span>`).join('');
        document.body.appendChild(pop);
        const rc=d.getBoundingClientRect();
        pop.style.left=Math.min(rc.left,window.innerWidth-pop.offsetWidth-10)+'px';
        pop.style.top=(rc.bottom+6)+'px';
        pop.querySelectorAll('[data-pickv]').forEach(p=>{
          p.onclick=()=>{
            const v=p.dataset.pickv;
            if(v==='n')delete HOLD[i].sig; else HOLD[i].sig=v;
            pop.remove();markDirty();render();
          };
        });
        setTimeout(()=>document.addEventListener('click',function close(ev){
          if(!pop.contains(ev.target)){pop.remove();document.removeEventListener('click',close);}
        }),0);
        e.stopPropagation();
      };
    });
    // 색 이름 입력
    document.querySelectorAll('.lbl-in').forEach(inp=>{
      inp.onchange=()=>{LABELS[inp.dataset.lbl]=inp.value.trim();markDirty();};
    });
    // 추가 상자의 신호 선택
    document.querySelectorAll('.dot[data-addsig]').forEach(d=>{
      d.onclick=()=>{
        document.querySelectorAll('.dot[data-addsig]').forEach(x=>x.classList.remove('sel'));
        d.classList.add('sel');
      };
    });
    $('#add-go').onclick=()=>{
      const code=$('#add-code').value.trim();
      const name=$('#add-name').value.trim();
      const buy=parseFloat($('#add-buy').value.replace(/,/g,''));
      const qty=parseFloat($('#add-qty').value.replace(/,/g,''));
      if(!/^[0-9A-Za-z]{4,6}$/.test(code)){toast('종목코드를 확인하세요 (예: 005930)');return;}
      if(!name||!isFinite(buy)||!isFinite(qty)){toast('종목명·매입단가·수량을 입력하세요');return;}
      if(HOLD.some(h=>h.code===code)){toast('이미 있는 종목코드입니다');return;}
      const sigEl=document.querySelector('.dot[data-addsig].sel');
      const sig=sigEl?sigEl.dataset.addsig:'n';
      const nh={code,name,buy,qty};
      if(sig!=='n')nh.sig=sig;
      HOLD.push(nh);
      markDirty();render();
      toast(name+' 추가됨 — [GitHub에 저장]을 눌러 반영하세요');
    };
  }
}

async function saveHoldings(){
  const ri=repoInfo();
  if(!ri){toast('GitHub Pages 주소에서만 저장할 수 있습니다 (미리보기 모드)');return;}
  let token=getToken();
  if(!token){askToken();return;}
  const btn=$('#btn-save');btn.disabled=true;btn.textContent='저장 중…';
  const apiUrl=`https://api.github.com/repos/${ri.owner}/${ri.repo}/contents/holdings.json`;
  const hdrs={Authorization:'Bearer '+token,Accept:'application/vnd.github+json'};
  try{
    const cur=await fetch(apiUrl,{headers:hdrs});
    if(cur.status===401||cur.status===403){setToken('');throw new Error('토큰이 유효하지 않습니다. 다시 입력해주세요.');}
    if(!cur.ok)throw new Error('holdings.json 조회 실패 ('+cur.status+')');
    const curJson=await cur.json();
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(HOLD,null,1))));
    const put=await fetch(apiUrl,{method:'PUT',headers:hdrs,body:JSON.stringify({
      message:'종목 편집 (대시보드에서 저장)',content,sha:curJson.sha})});
    if(!put.ok)throw new Error('저장 실패 ('+put.status+')');
    // 색 이름 설정 저장 (config.json — 없으면 새로 생성)
    const cfgUrl=`https://api.github.com/repos/${ri.owner}/${ri.repo}/contents/config.json`;
    const cfgCur=await fetch(cfgUrl,{headers:hdrs});
    const cfgBody={message:'설정 저장 (색 이름)',
      content:btoa(unescape(encodeURIComponent(JSON.stringify({labels:LABELS},null,1))))};
    if(cfgCur.ok){cfgBody.sha=(await cfgCur.json()).sha;}
    await fetch(cfgUrl,{method:'PUT',headers:hdrs,body:JSON.stringify(cfgBody)});
    dirty=false;editMode=false;render();
    toast('저장 완료 — 새 종목 시세는 다음 조회부터 반영됩니다');
  }catch(e){
    btn.disabled=false;btn.textContent='GitHub에 저장';
    toast(e.message||'저장 중 오류가 발생했습니다');
    if(!getToken())askToken();
  }
}

const todayKST=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);

// ---------- 라운드(회전 매매) · 시뮬레이션 · 메모 팝업 ----------
function roundAgg(rd){
  let sq=0,sa=0,bq=0,ba=0,first=null,last=null;
  for(const l of rd.legs){
    if(l.side==='s'){sq+=l.qty;sa+=l.price*l.qty;}else{bq+=l.qty;ba+=l.price*l.qty;}
    if(!first||l.d<first)first=l.d;
    if(!last||l.d>last)last=l.d;
  }
  const avgS=sq?sa/sq:null, avgB=bq?ba/bq:null;
  const matched=Math.min(sq,bq);
  const profit=(matched&&avgS!=null&&avgB!=null)?Math.round(matched*(avgS-avgB)):0;
  const dir=rd.legs.length?rd.legs[0].side:null; // 선행 방향
  return {sq,bq,avgS,avgB,matched,profit,dir,first,last,remain:Math.abs(sq-bq)};
}
function openRounds(h){return (h.rounds||[]).filter(r=>!r.closed);}
function hasActivity(h){return !!(h.memo||openRounds(h).length);}

function openTrade(i){
  const h=HOLD[i];
  if(!h.rounds)h.rounds=[];
  let showDone=false;

  const expanded=new Set();
  const draw=()=>{
    const cur=priceAt(h.code,0);
    const cost=h.buy*h.qty, val=cur!=null?cur*h.qty:null;
    const pl=val!=null?val-cost:null;
    const closed=h.rounds.filter(r=>r.closed);
    const opens=h.rounds.filter(r=>!r.closed);
    const totalProfit=closed.reduce((s,r)=>s+roundAgg(r).profit,0);

    const legRow=(rd,li)=>{
      const l=rd.legs[li];
      return `<div class="trow">
        <span class="hint">${l.d}</span>
        <span class="${l.side==='b'?'chipb':'chips'}">${l.side==='b'?'매수':'매도'}</span>
        <span>${fmt(l.price)} × ${fmt(l.qty)}주</span>
        <span class="sp"></span>
        ${rd.closed?'':`<button data-ldel="${h.rounds.indexOf(rd)}:${li}" title="잘못 입력한 기록 삭제 (평단·수량 되돌림)">취소</button>`}
      </div>`;
    };

    const openCard=rd=>{
      const ri=h.rounds.indexOf(rd);
      const a=roundAgg(rd);
      const waitBuy=a.dir==='s'; // 매도 선행 → 재매수 대기
      let sim='';
      if(a.dir&&a.remain>0){
        const base=waitBuy?a.avgS:a.avgB;
        sim=`<div class="simrow">차익
          <input data-simpct="${ri}" value="${rd.simPct!=null?rd.simPct:5}" inputmode="decimal">% 목표 →
          ${waitBuy?'매수가':'매도가'} <b data-simout="${ri}">—</b>
          <span class="hint" data-simexp="${ri}"></span></div>`;
      }
      return `<div class="round">
        <div class="rhead">
          <span class="${a.dir==='s'?'chips':'chipb'}">${a.dir==='s'?'매도 선행':a.dir==='b'?'매수 선행':'새 라운드'}</span>
          <span class="hint">${a.first||''}</span>
          <span class="rsum">${a.sq?`매도 ${fmt(a.sq)}주@${fmt(a.avgS)}`:''}${a.sq&&a.bq?' · ':''}${a.bq?`매수 ${fmt(a.bq)}주@${fmt(a.avgB)}`:''}${a.remain?` · <b>잔여 ${fmt(a.remain)}주 ${waitBuy?'재매수 대기':'매도 대기'}</b>`:a.dir?' · 수량 일치':''}</span>
          <span class="sp"></span>
          ${a.matched?`<span style="color:var(--${a.profit>=0?'up':'down'});font-weight:700">${a.profit>=0?'+':''}${fmt(a.profit)}</span>`:''}
          <button data-rclose="${ri}" title="라운드를 마감하고 회전 차익을 확정">종료</button>
        </div>
        ${rd.legs.map((_,li)=>legRow(rd,li)).join('')}
        <div class="tform">
          <input type="date" data-ld="${ri}" value="${todayKST()}">
          <select data-lside="${ri}"><option value="b" ${waitBuy?'selected':''}>매수</option><option value="s" ${!waitBuy&&a.dir?'selected':''}>매도</option></select>
          <input data-lprice="${ri}" placeholder="가격" style="width:88px;text-align:right" inputmode="decimal">
          <input data-lqty="${ri}" placeholder="수량" style="width:62px;text-align:right" inputmode="decimal">
          <button class="primary" data-ladd="${ri}">기록</button>
        </div>
        ${sim}
      </div>`;
    };

    const closedRow=rd=>{
      const ri=h.rounds.indexOf(rd);
      const a=roundAgg(rd);
      const isOpen=expanded.has(ri);
      return `<div class="trow" data-rexp="${ri}" style="cursor:pointer" title="클릭하면 세부 기록을 펼칩니다">
        <span class="rarrow">${isOpen?'▼':'▶'}</span><span class="hint">${a.first||''} ~ ${a.last||''}</span>
        <span class="${a.dir==='s'?'chips':'chipb'}">${a.dir==='s'?'매도 선행':'매수 선행'}</span>
        <span>${fmt(a.matched)}주 회전</span>
        <span style="color:var(--${a.profit>=0?'up':'down'});font-weight:700">${a.profit>=0?'+':''}${fmt(a.profit)}</span>
        <span class="sp"></span>
        <button data-rdel="${ri}" title="종료된 라운드를 목록에서 제거 (평단에는 영향 없음)">삭제</button>
      </div>${isOpen?`<div style="padding-left:18px">${rd.legs.map((_,li)=>legRow(rd,li)).join('')}</div>`:''}`;
    };

    $('#modal-slot').innerHTML=`<div class="overlay" id="tov"><div class="modal wide">
      <h2 style="padding:16px 18px 0;margin:0">${sigDot(h.sig)} ${esc(h.name)} <span class="hint">${esc(h.code)}</span></h2>
      <div class="mscroll">
        <div class="tstat">
          <div><div class="lbl">평단</div><div class="val">${fmt(h.buy)}</div></div>
          <div><div class="lbl">수량</div><div class="val">${fmt(h.qty)}</div></div>
          <div><div class="lbl">현재가</div><div class="val">${fmt(cur)}</div></div>
          <div><div class="lbl">평가손익</div><div class="val" style="color:var(--${(pl||0)>=0?'up':'down'})">${fmt(pl)}</div></div>
          <div><div class="lbl">회전 차익 누계</div><div class="val" style="color:var(--${totalProfit>=0?'up':'down'})">${totalProfit>=0?'+':''}${fmt(totalProfit)}</div></div>
        </div>

        <div class="tsec">진행 중 라운드
          <span class="hint" style="font-weight:400">— 기록하면 평단·수량에 자동 반영 · 첫 기록이 매도면 "급등 매도→재매수", 매수면 "급락 매수→매도" 회전</span></div>
        ${opens.length?opens.map(openCard).join(''):'<div class="hint" style="padding:4px 0">진행 중인 라운드 없음</div>'}
        <button id="r-new" style="margin-top:6px">+ 새 라운드</button>

        ${closed.length?`<div class="tsec">종료된 라운드</div>
          <div class="donefold" id="t-fold">${closed.length}건 · 회전 차익 합계
            <b style="color:var(--${totalProfit>=0?'up':'down'})">${totalProfit>=0?'+':''}${fmt(totalProfit)}</b>
            ${showDone?'접기 ▲':'보기 ▼'}</div>
          ${showDone?closed.map(closedRow).join(''):''}`:''}

        <div class="tsec">메모</div>
        <textarea class="memo-ta" id="t-memo" placeholder="이 종목에 대한 생각, 계획, 기준...">${esc(h.memo||'')}</textarea>
        <p class="hint" style="margin:8px 0 2px">※ 모든 계산에 증권거래세·거래수수료는 반영되어 있지 않습니다.</p>
      </div>
      <div class="mfoot" style="padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center">
        <span class="hint">${dirty?'변경사항은 메인 화면의 [GitHub에 저장]으로 보존됩니다':''}</span>
        <button id="t-close">닫기</button>
      </div>
    </div></div>`;

    // --- 라운드별 시뮬레이션 ---
    const runSim=ri=>{
      const rd=h.rounds[ri], a=roundAgg(rd);
      const inp=document.querySelector(`[data-simpct="${ri}"]`);
      const out=document.querySelector(`[data-simout="${ri}"]`);
      const exp=document.querySelector(`[data-simexp="${ri}"]`);
      if(!inp||!out)return;
      const p=parseFloat(inp.value)/100;
      rd.simPct=parseFloat(inp.value);
      if(!isFinite(p)||a.remain<=0){out.textContent='—';if(exp)exp.textContent='';return;}
      if(a.dir==='s'){ // 재매수 대기: 매도평균 대비 p% 아래에서 매수
        const target=a.avgS*(1-p);
        out.textContent=fmt(target)+'원';
        if(exp)exp.textContent=`(잔여 ${fmt(a.remain)}주 기준 예상 차익 +${fmt(a.remain*(a.avgS-target))})`;
      }else{ // 매도 대기: 매수평균 대비 p% 위에서 매도
        const target=a.avgB*(1+p);
        out.textContent=fmt(target)+'원';
        if(exp)exp.textContent=`(잔여 ${fmt(a.remain)}주 기준 예상 차익 +${fmt(a.remain*(target-a.avgB))})`;
      }
    };
    document.querySelectorAll('[data-simpct]').forEach(inp=>{
      const ri=+inp.dataset.simpct;
      inp.oninput=()=>runSim(ri);
      runSim(ri);
    });

    // --- 새 라운드 ---
    $('#r-new').onclick=()=>{h.rounds.push({legs:[]});draw();};

    // --- 기록 추가 ---
    document.querySelectorAll('[data-ladd]').forEach(b=>{
      b.onclick=()=>{
        const ri=+b.dataset.ladd, rd=h.rounds[ri];
        const d=document.querySelector(`[data-ld="${ri}"]`).value;
        const side=document.querySelector(`[data-lside="${ri}"]`).value;
        const price=parseFloat(document.querySelector(`[data-lprice="${ri}"]`).value.replace(/,/g,''));
        const qty=parseFloat(document.querySelector(`[data-lqty="${ri}"]`).value.replace(/,/g,''));
        if(!d||!isFinite(price)||price<=0||!isFinite(qty)||qty<=0){toast('날짜·가격·수량을 확인하세요');return;}
        if(side==='s'&&qty>h.qty){toast('보유 수량('+fmt(h.qty)+'주)보다 많이 팔 수 없습니다');return;}
        if(side==='b'){
          h.buy=(h.buy*h.qty+price*qty)/(h.qty+qty);
          h.qty=h.qty+qty;
        }else{
          h.qty=h.qty-qty;
        }
        rd.legs.push({d,side,price,qty});
        markDirty();render();draw();
      };
    });

    // --- 기록 취소 (평단·수량 롤백) ---
    document.querySelectorAll('[data-ldel]').forEach(b=>{
      b.onclick=()=>{
        const [ri,li]=b.dataset.ldel.split(':').map(Number);
        const rd=h.rounds[ri], l=rd.legs[li];
        if(!confirm('이 기록을 삭제하고 평단·수량을 되돌릴까요?'))return;
        if(l.side==='b'){
          const prevQty=h.qty-l.qty;
          if(prevQty<=0){toast('이후 매매와 얽혀 되돌릴 수 없습니다. [종목 편집]에서 직접 보정하세요');return;}
          h.buy=(h.buy*h.qty-l.price*l.qty)/prevQty;
          h.qty=prevQty;
        }else{
          h.qty=h.qty+l.qty;
        }
        rd.legs.splice(li,1);
        if(!rd.legs.length)h.rounds.splice(ri,1);
        markDirty();render();draw();
      };
    });

    // --- 라운드 종료 / 종료된 라운드 삭제 ---
    document.querySelectorAll('[data-rclose]').forEach(b=>{
      b.onclick=()=>{
        const ri=+b.dataset.rclose, a=roundAgg(h.rounds[ri]);
        if(!h.rounds[ri].legs.length){h.rounds.splice(ri,1);draw();return;}
        const msg=a.remain>0
          ?`잔여 ${fmt(a.remain)}주가 아직 ${a.dir==='s'?'재매수':'매도'}되지 않았습니다. 그래도 종료할까요?\n(회전 차익은 성사된 ${fmt(a.matched)}주 기준 ${a.profit>=0?'+':''}${fmt(a.profit)}원으로 확정)`
          :`라운드를 종료하고 회전 차익 ${a.profit>=0?'+':''}${fmt(a.profit)}원을 확정할까요?`;
        if(!confirm(msg))return;
        h.rounds[ri].closed=1;
        markDirty();render();draw();
      };
    });
    document.querySelectorAll('[data-rexp]').forEach(row=>{
      row.onclick=e=>{
        if(e.target.tagName==='BUTTON')return;
        const ri=+row.dataset.rexp;
        expanded.has(ri)?expanded.delete(ri):expanded.add(ri);
        draw();
      };
    });
    document.querySelectorAll('[data-rdel]').forEach(b=>{
      b.onclick=()=>{
        if(!confirm('종료된 라운드를 목록에서 제거할까요? (평단·수량에는 영향 없음)'))return;
        h.rounds.splice(+b.dataset.rdel,1);
        markDirty();render();draw();
      };
    });

    const fold=$('#t-fold');
    if(fold)fold.onclick=()=>{showDone=!showDone;draw();};
    $('#t-memo').onchange=()=>{
      const v=$('#t-memo').value.trim();
      if(v)h.memo=v; else delete h.memo;
      markDirty();
    };
    $('#t-close').onclick=()=>{$('#modal-slot').innerHTML='';render();};
    $('#tov').onclick=e=>{if(e.target.id==='tov'){$('#modal-slot').innerHTML='';render();}};
  };
  draw();
}

function askToken(){
  $('#modal-slot').innerHTML=`<div class="overlay" id="ov"><div class="modal">
    <h2>GitHub 토큰 연결 (최초 1회)</h2>
    <p>종목을 이 페이지에서 바로 저장하려면 GitHub 개인 액세스 토큰이 필요합니다.
    토큰은 <b>이 브라우저에만</b> 저장되며 외부로 전송되지 않습니다.</p>
    <p>만들기: GitHub → Settings → Developer settings → <b>Fine-grained tokens</b> → Generate new token
    → Repository access: 이 저장소만 선택 → Permissions: <b>Contents → Read and write</b> → Generate</p>
    <input id="tk" type="password" placeholder="github_pat_... 붙여넣기" autocomplete="off">
    <div class="mfoot">
      <button id="tk-cancel">취소</button>
      <button class="primary" id="tk-ok">연결</button>
    </div>
  </div></div>`;
  $('#tk-cancel').onclick=()=>{$('#modal-slot').innerHTML='';};
  $('#tk-ok').onclick=()=>{
    const t=$('#tk').value.trim();
    if(!t){toast('토큰을 입력하세요');return;}
    setToken(t);$('#modal-slot').innerHTML='';
    saveHoldings();
  };
}

function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3500);
}

async function load(){
  if(dirty&&!confirm('저장하지 않은 변경사항이 사라집니다. 새로고침할까요?'))return;
  dirty=false;
  try{
    const bust='?t='+Date.now();
    const [h,p,cfg]=await Promise.all([
      fetch('holdings.json'+bust).then(r=>{if(!r.ok)throw 0;return r.json();}),
      fetch('data/prices.json'+bust).then(r=>{if(!r.ok)throw 0;return r.json();}),
      fetch('config.json'+bust).then(r=>r.ok?r.json():null).catch(()=>null),
    ]);
    HOLD=h; HIST=p.sort((a,b)=>a.d<b.d?-1:1);
    if(cfg&&cfg.labels)LABELS=Object.assign({r:'',o:'',y:'',g:'',b:''},cfg.labels);
    render();
  }catch(e){
    $('#app').innerHTML='<div class="err"><b>데이터를 불러오지 못했습니다.</b><br>'
      +'holdings.json과 data/prices.json이 저장소에 있는지, GitHub Pages가 켜져 있는지 확인하세요.</div>';
  }
}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
load();
</script>
